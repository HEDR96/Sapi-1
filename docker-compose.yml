services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cattle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: cattle_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cattle_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cattle-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres123@db:5432/cattle_catalog"
      JWT_SECRET: "cattle-catalog-super-secret-jwt-key-2024"
      JWT_EXPIRES_IN: "24h"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # iDrive E2 Storage
      IDRIVE_ACCESS_KEY_ID: "${IDRIVE_ACCESS_KEY_ID}"
      IDRIVE_SECRET_ACCESS_KEY: "${IDRIVE_SECRET_ACCESS_KEY}"
      IDRIVE_BUCKET: "${IDRIVE_BUCKET}"
      IDRIVE_ENDPOINT: "${IDRIVE_ENDPOINT}"
      IDRIVE_REGION: "${IDRIVE_REGION}"
    depends_on:
      db:
        condition: service_healthy
    # Database setup: prisma db push only (no seed - run manually)
    command: >
      sh -c "
        echo 'Running database setup...' &&
        prisma db push --skip-generate &&
        echo 'Starting application...' &&
        node server.js
      "

volumes:
  postgres_data:
