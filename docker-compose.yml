services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cattle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: cattle_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cattle_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cattle-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres123@db:5432/cattle_catalog"
      JWT_SECRET: "cattle-catalog-super-secret-jwt-key-2024"
      JWT_EXPIRES_IN: "24h"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      DATA_DIR: "/app/data"
      # Google Drive OAuth - loaded from .env via env_file above
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
      GOOGLE_OAUTH_REDIRECT_URI: "${GOOGLE_OAUTH_REDIRECT_URI}"
      GOOGLE_DRIVE_IMAGE_FOLDER_ID: "${GOOGLE_DRIVE_IMAGE_FOLDER_ID}"
      GOOGLE_DRIVE_VIDEO_FOLDER_ID: "${GOOGLE_DRIVE_VIDEO_FOLDER_ID}"
    volumes:
      # Mount data directory for token storage
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    # Database setup: prisma db push only (no seed - run manually)
    command: >
      sh -c "
        mkdir -p /app/data &&
        chmod 777 /app/data &&
        echo 'Running database setup...' &&
        prisma db push --skip-generate &&
        echo 'Starting application...' &&
        node server.js
      "

volumes:
  postgres_data:
