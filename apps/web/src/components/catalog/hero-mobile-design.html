<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section Mobile Fix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    h2 { color: #2d5016; margin-bottom: 20px; }

    .solution-layout {
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      max-width: 400px;
    }

    .solution-image {
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      overflow: hidden;
    }

    .solution-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .solution-content {
      padding: 20px;
      background: #F4EFE2;
    }

    h3 { color: #444; margin: 15px 0 10px; }
    p { color: #666; font-size: 14px; line-height: 1.6; }

    .code-box {
      background: #1a1a2e;
      color: #a8dadc;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre;
      overflow-x: auto;
      margin-top: 20px;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <h2>HERO SECTION MOBILE FIX</h2>

  <h3>SOLUSI: Image menggunakan aspect-ratio + object-fit: cover</h3>
  <div class="solution-layout">
    <div class="solution-image">
      <img src="https://images.unsplash.com/photo-1551750590-90f231373f73?w=800" alt="Cattle">
    </div>
    <div class="solution-content">
      <h4 style="color:#2d5016;">Sapi Anda, Amanah Kami.</h4>
      <p style="font-size:12px;margin-top:8px;">Image menyesuaikan layar dengan proporsional</p>
    </div>
  </div>

  <h3>Key Fix:</h3>
  <ul style="color:#444;line-height:2;margin-left:20px;">
    <li>Gunakan <code>aspect-ratio: 16/10</code> untuk mobile</li>
    <li>Gunakan <code>object-fit: cover</code> agar image tidak terpotong</li>
    <li>Hapus <code>min-height</code> yang fixed</li>
  </ul>
</body>
</html>
